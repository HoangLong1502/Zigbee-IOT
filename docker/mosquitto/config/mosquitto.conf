# Mosquitto broker configuration for the Zigbee monitoring platform.
#
# Zigbee2MQTT publishes here; the NestJS backend subscribes to zigbee2mqtt/#.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Plain MQTT (Zigbee2MQTT + NestJS backend)
listener 1883
protocol mqtt

# MQTT over WebSockets (useful for browser based debugging tools)
listener 9001
protocol websockets

# Development default: anonymous access is allowed.
# For production create a password file and switch the two lines below:
#   docker exec -it zigbee-mosquitto mosquitto_passwd -c /mosquitto/config/passwd zigbee
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
allow_anonymous true

max_queued_messages 10000
message_size_limit 0
